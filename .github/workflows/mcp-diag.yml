# 一時診断（調査が済んだら削除する）
name: MCP diag
on:
  push:
    branches: ['feature/**']
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: dev electron --mcp
        run: node scripts/diag/mcp-stdio.js node_modules/electron/dist/electron.exe . --mcp
      - name: packaged --mcp
        run: node scripts/diag/mcp-stdio.js "dist/win-unpacked/事務ツール.exe" --mcp
      - name: packaged RUN_AS_NODE (stdin echo + better-sqlite3 load)
        run: |
          node -e "require('fs').writeFileSync('diag-node.js', 'process.stdin.on(\"data\",d=>process.stdout.write(\"echo:\"+d));try{const D=require(process.argv[2]);new D(\":memory:\");console.error(\"sqlite ok\")}catch(e){console.error(\"sqlite fail\",e.message)}')"
          node scripts/diag/mcp-stdio.js "dist/win-unpacked/事務ツール.exe" diag-node.js "${{ github.workspace }}/dist/win-unpacked/resources/app.asar.unpacked/node_modules/better-sqlite3"
        env:
          DIAG_RUN_AS_NODE: '1'
